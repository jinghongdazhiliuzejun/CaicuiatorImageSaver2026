        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/CaicuiatorImageSaver2026.app Payload/
          zip -r CaicuiatorImageSaver2026.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CaicuiatorImageSaver2026-IPA
          path: CaicuiatorImageSaver2026.ipa
