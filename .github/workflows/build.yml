          xcodebuild -project CaicuiatorImageSaver2026.xcodeproj -target CaicuiatorImageSaver2026 -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
